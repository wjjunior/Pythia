name: pythia

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: pythia
      POSTGRES_PASSWORD: pythia
      POSTGRES_DB: pythia
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pythia -d pythia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"

volumes:
  pgdata:
